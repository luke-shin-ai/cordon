# Cordon claim ledger
# One row per claim that may appear in a public surface (README, submission
# text, video captions).
#
# status: declared
#   The claim is written down and the scenario that would settle it is fixed.
#   No verdict of any scenario is recorded in this repository or in the
#   submission text: section 4.6(i) of the QNX Development License Agreement
#   (Non-Commercial) puts the publication of performance or functional
#   evaluation results behind prior written approval from BlackBerry, and that
#   approval has been requested and not yet given. A reader of this file learns
#   what Cordon checks, not what a run of it concluded.
#
# expected_result
#   What the scenario's rule requires for the image the scenario describes.
#   It is the rule of the check, not a record of a run. C5 is the negative
#   control: the rule requires that a misordered image is caught, so the row
#   states FAIL as the outcome the check demands.
#
# How a verdict is produced (host/cordon run):
#   the target prints one CORDON-OBS line per observed fact, the host applies
#   the rule for the scenario to those lines, and the gate compares the result
#   with expected_result below.

version: 2
product: cordon
target: QNX 8.0 x86_64 (QEMU, mkqnximage image)

claims:
  - id: C1
    statement: A guarded service keeps running when the process that consumes it is killed.
    scenario: kill-consumer
    qnx_features: [real-time services, startup and boot]
    evidence_source: observation lines from a boot of the normal image, under the scenario name kill-consumer
    status: declared
    expected_result: PASS
    note: The consumer is cordon-view, the long lived status reader. The image is built without QNX Screen (--graphics=no), so a small process stands in for the screen surface and the scenario name says consumer, not screen.

  - id: C2
    statement: A client without permission is refused when it writes to /dev/cordon.
    scenario: deny-unprivileged-write
    qnx_features: [security policies, message passing]
    evidence_source: observation lines from a boot of the normal image, under the scenario name deny-unprivileged-write
    status: declared
    expected_result: PASS
    note: The refusal inside the service is made by secpol_check_permission in cordon_write. A client type with no connect rule is refused one layer earlier by the kernel.

  - id: C3
    statement: A permitted process writes successfully and the event is recorded.
    scenario: allow-privileged-write
    qnx_features: [resource managers, message passing, security policies]
    evidence_source: observation lines from a boot of the normal image, under the scenario name allow-privileged-write
    status: declared
    expected_result: PASS

  - id: C4
    statement: After the guarded process dies, the supervisor starts it again and the restart is recorded.
    scenario: supervised-restart
    qnx_features: [real-time services]
    evidence_source: observation lines from a boot of the normal image, under the scenario name supervised-restart
    status: declared
    expected_result: PASS
    note: The supervisor is cordon-supervise. It uses posix_spawn, waitpid and slog2, and records a sequence number for every start. HAM is an optional QNX 8.0 package (com.qnx.qnx800.target.os_services.ham) that the installed baseline does not include, so a production image would put a HAM entity in this role; the scenario name says what the image does, which is supervision.

  - id: C5
    statement: An image that breaks startup order is caught by the startup-order check.
    scenario: boot-order-violation
    qnx_features: [startup and boot]
    evidence_source: observation lines from a boot of the misordered image, under the scenario name boot-order-violation
    status: declared
    kind: negative
    expected_result: FAIL
    note: The misordered image runs its first client before the service exists, so the rule for this scenario requires FAIL. If such an image produced PASS the gate fails, because then the control would not distinguish startup order at all.

  - id: C6
    statement: A correctly ordered image satisfies the startup-order check and the four positive scenarios.
    scenario: all-pass
    qnx_features: [startup and boot, resource managers, security policies, real-time services, message passing]
    evidence_source: observation lines from a boot of the normal image, under the scenario name all-pass
    status: declared
    expected_result: PASS
